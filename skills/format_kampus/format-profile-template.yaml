# Profil Format Kampus — kerangka isian (lihat SKILL.md skill format_kampus).
# Isi dari buku panduan resmi kampus pengguna. Nilai yang tidak diatur panduan: null.
# Nilai contoh di bawah ini BUKAN ketentuan kampus mana pun.

kampus:
  nama: ""            # nama resmi persis seperti di panduan
  fakultas: ""
  program_studi: ""
  sumber_panduan: ""  # nama berkas / edisi / tahun panduan

dokumen:
  ukuran_kertas: A4   # A4 | F4 | Letter
  margin_cm:
    kiri: 4
    atas: 3
    kanan: 3
    bawah: 3

font:
  nama: "Times New Roman"
  isi_pt: 12
  judul_bab: {pt: 14, tebal: true, kapital: true, rata: tengah}
  subbab: {pt: 12, tebal: true}
  sub_subbab: {pt: 12, tebal: true}
  judul_tabel_gambar_pt: 12

spasi:
  isi: 1.5            # spasi antarbaris naskah utama (1.0 | 1.5 | 2.0)
  judul: 1.5
  tabel: 1.0          # isi tabel boleh lebih rapat bila panduan mengizinkan
  daftar_pustaka: 1.0

sistematika:
  bagian_awal: []     # urutan: lembar judul, persetujuan, kata pengantar, ...
  bab: {}             # {"BAB I": ["1.1 ...", "1.2 ..."], ...}
  bagian_akhir: []    # daftar pustaka, riwayat hidup, lampiran, ...

penomoran_halaman:
  bagian_awal: {format: romawi_kecil, posisi: tengah_bawah, jarak_dari_bawah_cm: null, lembar_judul_dihitung_tanpa_nomor: true}
  bagian_pokok: {format: arab, mulai_dari: 1, awal_bab: tengah_bawah, halaman_lain: kanan_atas}
  bagian_akhir: {format: arab_lanjutan, posisi: tengah_bawah}

caption:
  tabel: {posisi: di_atas_tabel, rata: tengah, penomoran: "per bab, angka Romawi (Tabel III.1)"}
  gambar: {posisi: di_bawah_gambar, rata: tengah, penomoran: "per bab, angka Romawi (Gambar III.1)"}

sitasi:
  gaya: APA           # APA | IEEE | Vancouver | MLA | gaya kampus
  min_jurnal_atau_prosiding: null
  batas_usia_referensi_tahun: null
  aturan_khusus: []   # mis. kewajiban mengutip jurnal dosen kampus sendiri

sampul:
  urutan_baris: []    # judul, logo, kata SKRIPSI, diajukan..., nama, NIM, prodi, ...
  judul: {pt: 14, kapital: true, spasi: 1.5}
  kata_skripsi_pt: 18
  nama_nim_pt: 14
  institusi_pt: 12

bahasa:
  istilah_asing: miring   # istilah asing tanpa padanan ditulis miring

# --- cincin opsional: hanya bila panduan mengaturnya -------------------------
# Catatan kaki / endnote. Profil yang tidak menyebut bagian ini berarti
# panduan tidak mengaturnya (jangan diisi dugaan).
catatan_kaki:
  dipakai: null          # true | false | null (tidak diatur)
  wajib: null            # true bila panduan mewajibkan footnote
  gaya: null             # footnote | endnote | angka dalam kurung
  penomoran: null        # per_halaman | per_bab | berurutan
  spasi: null            # spasi di dalam catatan kaki

# Lampiran: apakah dihitung dalam batas halaman minimal, dan bagaimana dinomori.
lampiran:
  dihitung_dalam_batas_halaman: null   # false = lampiran di luar hitungan
  penomoran: null                      # "angka Arab (Lampiran 1)" | "Romawi (Lampiran I)"
  halaman_lampiran_dinomori: null      # true bila halaman lampiran punya nomor sendiri

# Aturan pengutipan. Isi hanya bila panduan mengaturnya (lihat presets/ars-fti.yaml).
# Dibaca oleh scripts/periksa_kutipan.py; tanpa blok ini pemeriksa dilewati.
kutipan:
  batas_baris_blok: null               # mis. 5: >= batas = blok tanpa tanda kutip
  langsung_pendek: {spasi: null, tanda_kutip: null, ikut_paragraf: null}
  langsung_panjang: {spasi: null, tanda_kutip: null, menjorok: null, menjorok_cm: null}
  tidak_langsung: {tanda_kutip: null, spasi: null}
  sumber_sekunder: null                # pola contoh, mis. "X dalam Y (Tahun:Hal)"
  et_al_dalam_teks: null               # dilarang | boleh_tiga_atau_lebih | null (belum diketahui)

# Integritas / penggunaan AI. Isi hanya bila panduan kampus mengaturnya; dibaca oleh
# skills/integritas_akademik/scripts/cek_integritas_ai.py (dan gate_naskah.sh).
integritas:
  pernyataan_ai: null    # wajib | dianjurkan | tidak_diatur | null (belum diketahui)
  letak_pernyataan: null # mis. "setelah Kata Pengantar" — hanya bila panduan menyebut
  sumber: null           # nama dokumen + pasal

pengecualian: []      # penyimpangan yang disetujui pengguna, dicatat eksplisit
catatan_konflik: []   # ketentuan panduan yang saling bertentangan, untuk ditanyakan
