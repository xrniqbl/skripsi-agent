# Profil Format Kampus — Universitas Gadjah Mada
# DIKONVERSI OTOMATIS dari campus_templates/ugm.json oleh
# scripts/campus_json2yaml.py. Jangan disunting tangan: perbaiki
# JSON sumbernya, atau salin berkas ini lalu ubah manual (tandai
# 'manual: true' di kepala berkas supaya konverter tidak menimpanya).
#
# Setiap nilai null berarti panduan TIDAK menyebutkannya — bukan nol,
# bukan default. Periksa catatan_konflik sebelum memakai profil ini
# untuk dokumen yang akan dicetak.
kampus:
  nama: Universitas Gadjah Mada
  fakultas: ''
  program_studi: skripsi, thesis, disertasi
  sumber_panduan: Panduan Penulisan Skripsi Fakultas Kedokteran Hewan UGM
  sumber_template: dikonversi dari campus_templates/ugm.json
  catatan_sumber: 'Panduan Penulisan Skripsi Fakultas Kedokteran Hewan UGM | Angka format diambil dari
    Panduan Penulisan Skripsi Fakultas Kedokteran Hewan UGM (2024). UGM TIDAK memiliki satu pedoman tunggal:
    DTSL Fakultas Teknik (2023) mengatur spasi 1,15 dan margin berbeda. Wajib cek pedoman fakultas Anda;
    preset ini memakai nilai FKH sebagai titik awal.'
dokumen:
  ukuran_kertas: A4
  margin_cm:
    kiri: 4.0
    atas: 4.0
    kanan: 3.0
    bawah: 3.0
font:
  nama: Times New Roman
  isi_pt: 12.0
  warna: hitam
  judul_bab:
    pt: 14.0
    tebal: true
    kapital: true
    rata: tengah
  subbab:
    pt: 12.0
    tebal: true
  sub_subbab:
    pt: 12.0
    tebal: true
  judul_tabel_gambar_pt: 12.0
spasi:
  isi: 2.0
  judul: 1.5
  tabel: 1.0
  daftar_pustaka: 1.0
  catatan_daftar_pustaka: tiap entri 1 spasi, jarak antar entri 2 spasi
sistematika:
  bagian_awal:
  - Halaman Judul
  - Lembar Pengesahan
  - Pernyataan Keaslian
  judul_bab:
    BAB I: PENDAHULUAN
    BAB II: TINJAUAN PUSTAKA
    BAB III: METODE PENELITIAN
    BAB IV: HASIL DAN PEMBAHASAN & BAB V KESIMPULAN DAN SARAN
  bab:
    BAB I:
    - Latar Belakang Masalah
    - Rumusan Masalah
    - Tujuan Penelitian
    - Manfaat Penelitian
    - Batasan Masalah
    BAB II:
    - Landasan Teori
    - Hubungan Antarvariabel
    - Penelitian Terdahulu yang Relevan
    - Kerangka Berpikir
    - Hipotesis
    BAB III:
    - Desain Penelitian
    - Populasi dan Sampel
    - Variabel Penelitian
    - Definisi Operasional Variabel
    - Skala Pengukuran
    - Teknik Pengumpulan Data
    - Teknik Analisis Data
    BAB IV:
    - BAB IV Hasil dan Pembahasan
    - BAB V Kesimpulan dan Saran
  bagian_akhir:
  - Daftar Pustaka
  - Lampiran
penomoran_halaman:
  bagian_awal:
    format: romawi_kecil
    posisi: tengah_bawah
    jarak_dari_bawah_cm: 2.0
    lembar_judul_dihitung_tanpa_nomor: true
    sampul_dihitung: true
    nomor_disembunyikan: []
  bagian_pokok:
    format: arab
    mulai_dari: 1
    awal_bab: tengah_bawah
    halaman_lain: tengah_bawah
  bagian_akhir:
    format: arab_lanjutan
    posisi: tengah_bawah
caption:
  tabel:
    posisi: di_atas_tabel
    rata: tengah
    penomoran: BELUM DIKETAHUI
  gambar:
    posisi: di_bawah_gambar
    rata: tengah
    penomoran: BELUM DIKETAHUI
sitasi:
  gaya: APA
  min_jurnal_atau_prosiding: null
  batas_usia_referensi_tahun: null
  aturan_khusus:
  - heading "DAFTAR PUSTAKA" di halaman baru
sampul:
  judul:
    pt: 14.0
    kapital: true
    spasi: 1.5
  kata_skripsi_pt: 18
  nama_nim_pt: 14.0
  institusi_pt: 12.0
  kalimat_diajukan: Diajukan untuk memenuhi salah satu syarat kelulusan Program Sarjana
bahasa:
  istilah_asing: miring
pengecualian: []
catatan_konflik:
- bagian akhir (Daftar Pustaka/Lampiran) tidak disebut — dipakai Arab lanjutan, bukan mulai dari 1
- penomoran caption (Tabel 4.1 vs Tabel IV.1) tidak disebut — periksa panduan sebelum menulis caption
